<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none" role="img" aria-label="PSRWeb wordmark">
  <!-- Mark: 3-step staircase (ascending = steps) + record dot -->
  <rect x="2"  y="22" width="9" height="9" rx="2" fill="oklch(58% 0.18 255)"/>
  <rect x="13" y="15" width="9" height="16" rx="2" fill="oklch(58% 0.18 255)" opacity="0.75"/>
  <rect x="24" y="8"  width="9" height="23" rx="2" fill="oklch(58% 0.18 255)" opacity="0.5"/>
  <!-- Record dot -->
  <circle cx="37" cy="10" r="4" fill="oklch(55% 0.2 22)"/>
  <!-- Wordmark -->
  <text x="46" y="26"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif"
    font-size="17"
    font-weight="600"
    letter-spacing="-0.5"
    fill="oklch(18% 0.012 250)">PSRWeb</text>
</svg>
